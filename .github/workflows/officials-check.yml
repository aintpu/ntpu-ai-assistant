name: 現任主管換人偵測

# 使用者 2026-10-11 選定：程式抓候選姓名，人工確認後才上線。
# 每天檢查 mcp/src/ingestion/officials.ts 的主管姓名是否仍在官方介紹頁上（學校公開 API）。
# 有人不在頁面上時：把候選姓名寫進對照表推到分支並開 PR（附官方頁面）；抓不到候選姓名時開 issue。
# 不會直接修改 main、不會自動合併或部署：要有人開頁面確認候選姓名後合併 PR，再部署 MCP 才生效。
# （2026-10-11 使用者同意開啟 repo 設定「允許 GitHub Actions 建立 PR」。）
on:
  schedule:
    - cron: "0 1 * * *" # 每天 09:00（台北）
  workflow_dispatch:

permissions:
  contents: write # 推送候選分支（不碰 main）
  pull-requests: write
  issues: write

concurrency:
  group: officials-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 檢查主管頁面
        working-directory: mcp
        run: node --experimental-strip-types --no-warnings scripts/check-officials.mjs --write --report "$RUNNER_TEMP/officials-report.json"

      - name: 推送候選分支並通知
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/officials-report.json
        run: |
          set -euo pipefail
          changed=$(node -e 'const r=require(process.env.REPORT);console.log(r.results.filter(x=>x.status!=="ok").length)')
          if [ "$changed" = "0" ]; then echo "所有主管姓名都還在官方頁面上"; exit 0; fi

          today=$(date -u +%Y-%m-%d)
          branch="officials-update-$today"
          has_pr=""
          if ! git diff --quiet -- mcp/src/ingestion/officials.ts; then
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "分支 $branch 已存在，不重複推送"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout -b "$branch"
              git add mcp/src/ingestion/officials.ts
              git commit -m "chore(mcp): 現任主管候選姓名（$today 自動偵測，待人工確認）"
              git push origin "$branch"
            fi
            has_pr="1"
          fi

          node - "$has_pr" > "$RUNNER_TEMP/body.md" <<'EOF'
          const r = require(process.env.REPORT);
          const hasPr = process.argv[2] === "1";
          const label = { changed: "姓名不在頁面上，有候選姓名", no_candidate: "姓名不在頁面上，抓不到候選姓名", missing_page: "頁面不存在" };
          const rows = r.results.filter((x) => x.status !== "ok").map((x) =>
            `| ${x.title} | ${x.oldName ?? "（無中文姓名）"} | ${x.candidates.join("、") || "—"} | ${label[x.status]} | [官方頁面](${x.url}) |`);
          console.log(`排程在 ${r.today} 發現下列主管的姓名已不在官方介紹頁上。MCP 已自動停止提供這些舊資料（隔離區），新主管要確認後才會上線。

          | 職務 | 對照表姓名 | 候選姓名 | 狀況 | 來源 |
          |---|---|---|---|---|
          ${rows.join("\n")}

          **確認步驟**
          1. 打開官方頁面，確認候選姓名確實是現任主管（程式是從頁面文字推測的，可能抓錯）。
          2. ${hasPr ? `確認無誤就合併這個 PR（候選姓名已寫進 \`mcp/src/ingestion/officials.ts\`，英文姓名與任期已清空）。若官網英文頁有新主管的英文姓名、頁面寫了任期，可在這個 PR 補上 \`nameEn\`／\`nameEnOfficial\`／\`term\`；候選姓名錯了就直接修正或關閉 PR。` : "沒有候選姓名可寫入，請手動更新 `mcp/src/ingestion/officials.ts`。"}
          3. 合併後部署 MCP：\`cd mcp && npx wrangler deploy --config wrangler.ingest.jsonc --env production\`。下一次排程抓取確認姓名在頁面上後，就會提供給 AIA。`);
          EOF

          title="[現任主管] $today 偵測到主管換人，候選姓名待確認"
          if [ -n "$has_pr" ]; then
            existing=$(gh pr list --state open --search "[現任主管] in:title" --json number -q '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh pr comment "$existing" --body-file "$RUNNER_TEMP/body.md"
            elif ! gh pr list --state open --head "$branch" --json number -q '.[0].number' | grep -q .; then
              gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
          else
            existing=$(gh issue list --state open --search "[現任主管] in:title" --json number -q '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
          fi
